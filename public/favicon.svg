<svg viewBox="0 0 512 512" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="favBgGrad" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>

    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="favAmbientGlow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- 'E' Architectural Frame Gradient -->
    <linearGradient id="favFrameGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dynamic Play Triangle Gradient -->
    <linearGradient id="favPlayGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Play Triangle Core Glow -->
    <linearGradient id="favPlayCore" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Accent Slanted Bar Gradient -->
    <linearGradient id="favAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- AI Intelligence Spark Gradient -->
    <radialGradient id="favSparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#favBgGrad)" stroke="url(#favBorderGrad)" stroke-width="4" />

  <!-- 2. Ambient Light Corona -->
  <circle cx="260" cy="272" r="160" fill="url(#favAmbientGlow)" />

  <!-- 3. Architectural 'É' Outer Frame (Stem, Top and Bottom Arms) -->
  <path
    d="M 166 144
       L 338 144
       C 346 144 351 149 348 157
       L 337 186
       C 334 192 328 196 321 196
       L 194 196
       C 190.7 196 188 198.7 188 202
       L 188 338
       C 188 341.3 190.7 344 194 344
       L 321 344
       C 328 344 334 348 337 354
       L 348 383
       C 351 391 346 396 338 396
       L 166 396
       C 147.2 396 132 380.8 132 362
       L 132 178
       C 132 159.2 147.2 144 166 144 Z"
    fill="url(#favFrameGrad)"
  />

  <!-- 4. Cinema 35mm Perforations on Stem -->
  <g>
    <rect x="152" y="222" width="14" height="22" rx="5" fill="#050811" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="152" y="259" width="14" height="22" rx="5" fill="#050811" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="152" y="296" width="14" height="22" rx="5" fill="#050811" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
  </g>

  <!-- 5. Middle Bar: Dynamic Glowing Cinema Play Triangle -->
  <path
    d="M 218 223
       C 225 218 234 222 239 227
       L 348 263
       C 356 266 356 274 348 277
       L 239 313
       C 234 318 225 322 218 317
       C 212 312 212 304 212 296
       L 212 244
       C 212 236 212 228 218 223 Z"
    fill="url(#favPlayGrad)"
  />

  <!-- Play Triangle Luminous Core -->
  <path
    d="M 224 238
       C 227 235 233 237 236 240
       L 326 267
       C 330 269 330 271 326 273
       L 236 300
       C 233 303 227 305 224 302
       C 220 299 220 294 220 288
       L 220 252
       C 220 246 220 241 224 238 Z"
    fill="url(#favPlayCore)"
    opacity="0.95"
  />

  <!-- 6. Acute Accent of the 'É' -->
  <path
    d="M 218 122
       L 282 82
       C 287 79 288 72 284 68
       C 280 64 273 65 269 68
       L 206 108
       C 201 111 200 118 204 122
       C 208 126 214 125 218 122 Z"
    fill="url(#favAccentGrad)"
  />

  <!-- 7. AI Intelligence 4-Pointed Starburst Spark -->
  <path
    d="M 310 28
       Q 310 68 350 68
       Q 310 68 310 108
       Q 310 68 270 68
       Q 310 68 310 28 Z"
    fill="url(#favSparkGrad)"
  />

  <!-- Inner Diamond Core -->
  <path
    d="M 310 46
       Q 310 68 332 68
       Q 310 68 310 90
       Q 310 68 288 68
       Q 310 68 310 46 Z"
    fill="#ffffff"
  />
  <circle cx="310" cy="68" r="4" fill="#ffffff" />
</svg>
